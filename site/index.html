<body>
  <a class="skip" href="#deck">슬라이드로 이동</a>
  <header class="toolbar"><div class="toolbar-left"><time id="clock" aria-label="현재 시각"></time><a href="#1" class="brand" aria-label="첫 슬라이드">ROBOCO <span>AI 시대의 학습법</span></a></div><nav aria-label="발표 도구"><button id="overview" aria-haspopup="dialog">목차 <kbd>O</kbd></button><button id="notes-toggle" aria-expanded="false" aria-controls="notes">노트 <kbd>N</kbd></button><button id="fullscreen" aria-pressed="false">전체화면 <kbd>F</kbd></button><button id="print">인쇄</button></nav></header>
  <main id="deck" tabindex="-1" aria-label="발표 슬라이드"></main>
  <noscript><p>이 발표자료는 JavaScript가 필요합니다. 브라우저 설정에서 활성화해 주세요.</p></noscript>
  <footer class="navigation"><span id="chapter"></span><div><button id="prev" aria-label="이전 슬라이드">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="다음 슬라이드">→</button></div><span class="keyboard-hint">← → · PgUp PgDn 이동 · O 목차 · N 노트</span></footer>

  <button id="presentation-exit" hidden aria-label="발표 화면 종료">발표 종료 <kbd>Esc</kbd></button>
